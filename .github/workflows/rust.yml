name: Push or PR

on:
  [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_n_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: check
        if: ${{ !cancelled() }}
        run: cargo check --verbose
      - name: clippy
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo build --verbose --examples --tests
          cargo build --verbose --examples --tests
          cargo build --verbose --examples --tests
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "Some of jobs failed" && false


  semver:
    name: Check semver
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9