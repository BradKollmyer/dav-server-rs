on:
  push:
  pull_request:
  workflow_dispatch:

name: CI

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo check --all-features

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check build with --no-default-features
        run: cargo build --no-default-features
      - name: Check build with default features
        run: cargo build
      - name: Check build with warp
        run: cargo build --features warp-compat
      - name: Check build with actix-web
        run: cargo build --features actix-compat
      - name: Check build with caldav
        run: cargo build --features caldav
      - name: Test
        run: cargo test --all-features --all

  semver:
    name: Check semver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  compliance:
    name: Compliance Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build sample litmus server
        run: cargo build --example sample-litmus-server
      - name: Run sample litmus server
        run: |
          ./target/debug/examples/sample-litmus-server --memfs --auth &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 http://127.0.0.1:4918/ || true)
            case "$code" in
              [1-9][0-9][0-9]) echo "server up: $code"; exit 0 ;;
            esac
            sleep 1
          done
          echo "sample-litmus-server did not start"
          exit 1
      - name: Build litmus
        run: |
          curl -fsSL -o litmus-0.13.tar.gz https://notroj.github.io/litmus/litmus-0.13.tar.gz
          tar xf litmus-0.13.tar.gz
          cd litmus-0.13
          ./configure
          make
      - name: Run litmus protocol compliance test
        run: |
          cd litmus-0.13
          TESTS="http basic copymove locks props" HTDOCS=htdocs TESTROOT=. ./litmus http://127.0.0.1:4918/ someuser somepass
